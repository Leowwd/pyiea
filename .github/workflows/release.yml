name: Release

# Publishes pyiea to PyPI when a tag vX.Y.Z is pushed, through PyPI trusted publishing (OIDC):
# no API token is stored in the repository. One-time setup and the release steps are in
# CONTRIBUTING.md ("Releasing").

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version (expected v$version)"
            exit 1
          fi
      - name: Check that CHANGELOG.md has a section for this version
        run: |
          version=${GITHUB_REF_NAME#v}
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1; }
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: pyiea-dist
          path: dist/
          if-no-files-found: error

  test-wheel:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: pyiea-dist
          path: dist/
      - name: Run the tests against the installed wheel, away from the source tree
        run: |
          pip install dist/*.whl pytest
          mkdir "$RUNNER_TEMP/wheel-tests"
          cp -r tests examples README.md pyproject.toml "$RUNNER_TEMP/wheel-tests/"
          cd "$RUNNER_TEMP/wheel-tests"
          python -c "import pyiea; assert 'site-packages' in pyiea.__file__, pyiea.__file__"
          python -m pytest tests -p no:cacheprovider

  publish:
    needs: test-wheel
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyiea/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pyiea-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
